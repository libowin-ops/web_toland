      <div class="tl-container-narrow">
        <div class="tl-timeline ml-2 md:ml-8">
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_1991_t">1991 · 创立</h3>
            <p data-i18n="about.path_1991_d">于江苏丹阳成立,从特种合金的小批量加工起步。</p>
          </div>
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_2000_t">2000 · 体系建设</h3>
            <p data-i18n="about.path_2000_d">完成 ISO 质量管理体系认证,正式进入航空航天供应链。</p>
          </div>
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_2008_t">2008 · 高温合金深耕</h3>
            <p data-i18n="about.path_2008_d">高温合金产线扩建,镍基耐蚀合金打入石化用户。</p>
          </div>
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_2015_t">2015 · 技术中心</h3>
            <p data-i18n="about.path_2015_d">获评省级企业技术中心,产学研合作体系成型。</p>
          </div>
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_2020_t">2020 · 上市</h3>
            <p data-i18n="about.path_2020_d">深交所创业板挂牌,股票代码 300855,资本平台正式落地。</p>
          </div>
          <div class="tl-timeline-step tl-fade-in">
            <h3 data-i18n="about.path_2024_t">至今 · 持续投入</h3>
            <p data-i18n="about.path_2024_d">继续在变形高温合金、精密合金等战略品类扩大产能。</p>
          </div>
        </div>
