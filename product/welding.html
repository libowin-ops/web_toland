<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>焊接材料 · 产品系列 · 图南合金</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230071e3'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23fff' font-family='-apple-system,Inter,sans-serif' font-weight='600'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { 'tl-bg':'#ffffff','tl-elevated':'#ffffff','tl-subtle':'#f5f5f7','tl-text':'#1d1d1f','tl-secondary':'#6e6e73','tl-muted':'#86868b','tl-blue':'#0071e3','tl-cyan':'#0066cc' },
      maxWidth: { 'tl': '1200px' },
      fontFamily: { sans: ['Inter','SF Pro Display','-apple-system','BlinkMacSystemFont','PingFang SC','Helvetica Neue','sans-serif'] },
    }}};
  </script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <noscript><div class="tl-noscript">本站需开启 JavaScript 以获得完整体验 / Please enable JavaScript for the full experience.</div></noscript>

  <div data-tl-nav-mount></div>

  <main id="main">
    <section class="tl-page-hero">
      <div class="tl-container">
        <p class="tl-section-eyebrow" data-i18n="products.eyebrow">产品系列</p>
        <h1 data-i18n="p_welding.title">焊接材料</h1>
        <p data-i18n="p_welding.lead">产品概览</p>
      </div>
    </section>

    <nav class="tl-breadcrumb" aria-label="breadcrumb">
      <a href="../" data-i18n="crumb.home">首页</a>
      <span class="tl-breadcrumb-sep">/</span>
      <a href="../product/" data-i18n="crumb.products">产品系列</a>
      <span class="tl-breadcrumb-sep">/</span>
      <span data-i18n="p_welding.title">焊接材料</span>
    </nav>

    <section class="tl-section">
      <div class="tl-container-narrow">
        <h2 class="tl-section-title tl-fade-in" data-i18n="products.detail_apps">典型应用</h2>
        <ul class="space-y-2 text-tl-secondary mt-6 tl-fade-in" style="font-size:1.0625rem;line-height:1.6;">
          <li>· <span data-i18n="p_welding.app1">应用 1</span></li>
          <li>· <span data-i18n="p_welding.app2">应用 2</span></li>
          <li>· <span data-i18n="p_welding.app3">应用 3</span></li>
        </ul>
      </div>
    </section>

    <section class="tl-section tl-section-alt">
      <div class="tl-container-narrow">
        <h2 class="tl-section-title tl-fade-in" data-i18n="products.detail_specs">规格范围</h2>
        <p class="tl-section-lead tl-fade-in mt-6" data-i18n="p_welding.spec">规格</p>

        <h2 class="tl-section-title tl-fade-in mt-16" data-i18n="products.detail_grades">常见牌号</h2>
        <p class="tl-section-lead tl-fade-in mt-6 font-mono text-tl-text" data-i18n="p_welding.grade" style="letter-spacing:0;">牌号</p>
      </div>
    </section>

    <section class="tl-section">
      <div class="tl-container">
        <h2 class="tl-section-title tl-fade-in" data-i18n="products.detail_lines">对应产线</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mt-10" data-stagger>
          <a class="tl-card block" href="../production/smelting.html">
            <h3 data-i18n="lines.smelting_name">特种冶炼产线</h3>
            <p data-i18n="lines.smelting_desc">从纯净度起步。</p>
          </a>
          <a class="tl-card block" href="../production/drawing.html">
            <h3 data-i18n="lines.drawing_name">拉丝产线</h3>
            <p data-i18n="lines.drawing_desc">焊丝成型。</p>
          </a>
        </div>

        <div class="mt-12 flex flex-wrap gap-3 tl-fade-in">
          <button type="button" class="tl-btn" data-chat-trigger data-i18n="products.detail_inquiry">咨询此产品</button>
          <a href="../product/" class="tl-btn tl-btn-ghost" data-i18n="products.more">查看全部产品</a>
        </div>
      </div>
    </section>
  </main>

  <div data-tl-footer-mount></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/parallax.js"></script>
  <script src="../assets/js/search.js"></script>
  <script src="../assets/js/chat.js"></script>
</body>
</html>
